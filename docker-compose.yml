
services:

  # ==========================================
  # MOTEUR IA PYTHON
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    container_name: pronoia-ai

    volumes:
      - ./ai-service/app:/app/app
      - ./ai-service/data:/app/data

    environment:
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-}
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ==========================================
  # APPLICATION WEB LARAVEL
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pronoia-laravel

    ports:
      - "8000:80"

    env_file:
      - .env

    environment:
      APP_URL: http://127.0.0.1:8000

      AI_SERVICE_URL: http://ai-service:8000

      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-prono}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}

    depends_on:
      ai-service:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================
  # PLANIFICATEUR LARAVEL EN ARRIÈRE-PLAN
  # ==========================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pronoia-scheduler

    env_file:
      - .env

    environment:
      APP_URL: http://127.0.0.1:8000
      AI_SERVICE_URL: http://ai-service:8000
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-prono}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}

    command: php artisan schedule:work

    depends_on:
      ai-service:
        condition: service_healthy

    restart: unless-stopped
